<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生日快乐 · 逐字弹跳 + 音乐列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 3.5rem;
            padding: 3rem 2rem;
            box-shadow: 0 25px 45px -10px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        .title {
            text-align: center;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 1.1rem;
            color: rgba(255, 215, 150, 0.5);
            text-transform: uppercase;
            border-bottom: 1px dashed rgba(255, 215, 150, 0.15);
            padding-bottom: 0.75rem;
            width: 100%;
        }

        /* ===== 逐字弹跳动画 ===== */
        .bounce-text {
            font-size: clamp(3rem, 12vw, 5.5rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-align: center;
            color: #fae3d9;
            text-shadow: 0 4px 20px rgba(255, 160, 120, 0.15);
            line-height: 1.4;
            padding: 0.5rem 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.05em;
        }

        .bounce-text span {
            display: inline-block;
            animation: bounceLetter 0.9s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite alternate;
            animation-delay: calc(0.08s * var(--i, 0));
            transform-origin: center bottom;
            text-shadow: 0 2px 10px rgba(255, 140, 80, 0.3);
        }

        @keyframes bounceLetter {
            0% {
                transform: translateY(0) scale(0.9);
                color: #ffdcc9;
                text-shadow: 0 0 5px #ffaf8a;
            }

            100% {
                transform: translateY(-0.25em) scale(1.05);
                color: #fff0e5;
                text-shadow: 0 8px 25px #ff8040;
            }
        }

        /* ===== 音乐播放器样式 ===== */
        .music-player {
            width: 100%;
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 150, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            width: 100%;
        }

        .music-info {
            color: rgba(255, 215, 180, 0.6);
            font-size: 0.85rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .music-info .icon {
            font-size: 1.2rem;
        }

        .music-player audio {
            width: 280px;
            max-width: 100%;
            height: 40px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
        }

        .music-player audio::-webkit-media-controls-panel {
            background: rgba(255, 215, 150, 0.05);
            border-radius: 30px;
        }

        .music-player audio::-webkit-media-controls-play-button {
            background-color: #ffb08c;
            border-radius: 50%;
        }

        /* ===== 播放列表 ===== */
        .playlist {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 215, 150, 0.06);
        }

        .playlist-btn {
            padding: 0.4rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 150, 0.1);
            border-radius: 30px;
            color: rgba(255, 215, 180, 0.5);
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .playlist-btn:hover {
            background: rgba(255, 215, 150, 0.1);
            color: rgba(255, 215, 180, 0.8);
            border-color: rgba(255, 215, 150, 0.2);
            transform: translateY(-1px);
        }

        .playlist-btn.active {
            background: rgba(255, 180, 130, 0.15);
            border-color: #ffb08c;
            color: #ffdcc9;
            box-shadow: 0 0 20px rgba(255, 180, 130, 0.1);
        }

        .current-song {
            color: rgba(255, 215, 180, 0.3);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1rem;
                border-radius: 2.5rem;
                gap: 2rem;
            }

            .bounce-text {
                font-size: clamp(2.2rem, 14vw, 3.2rem);
            }

            .music-player {
                padding: 1.2rem;
                border-radius: 30px;
            }

            .music-player audio {
                width: 100%;
            }

            .player-controls {
                flex-direction: column;
                gap: 0.8rem;
            }

            .playlist {
                gap: 0.5rem;
            }

            .playlist-btn {
                padding: 0.3rem 1rem;
                font-size: 0.7rem;
            }
        }

        .footer-note {
            text-align: center;
            color: rgba(255, 200, 170, 0.15);
            font-size: 0.7rem;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255, 200, 170, 0.05);
            padding-top: 1.5rem;
            width: 100%;
            font-weight: 300;
        }

        .footer-note span {
            color: rgba(255, 180, 150, 0.2);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="title">✨ 生日快乐 ✨</div>

        <!-- 逐字弹跳效果 -->
        <div class="bounce-text">
            <span style="--i:0;">🎂</span>
            <span style="--i:1;">生</span>
            <span style="--i:2;">日</span>
            <span style="--i:3;">快</span>
            <span style="--i:4;">乐</span>
            <span style="--i:5;">🎈</span>
        </div>

        <!-- 音乐播放器 + 播放列表 -->
        <div class="music-player">
            <div class="player-controls">
                <div class="music-info">
                    <span class="icon">🎵</span>
                    <span id="currentSongName">生日歌</span>
                </div>
                <audio id="audioPlayer" controls loop>
                    <source src="music1.mp3" type="audio/mpeg">
                    您的浏览器不支持 audio 元素。
                </audio>
                <span class="current-song" id="songCounter">1 / 3</span>
            </div>

            <!-- 播放列表按钮 -->
            <div class="playlist">
                <button class="playlist-btn active" data-index="0">🎂 生日歌 ①</button>
                <button class="playlist-btn" data-index="1">🎈 生日歌 ②</button>
                <button class="playlist-btn" data-index="2">🎁 生日歌 ③</button>
            </div>
        </div>

        <div class="footer-note">
            <span>💡 将音乐文件命名为 music.mp3, birthday_song_02.mp3, birthday_song_03.mp3</span>
        </div>
    </div>

    <script>
        // ===== 音乐播放列表管理 =====
        const audio = document.getElementById('audioPlayer');
        const songName = document.getElementById('currentSongName');
        const songCounter = document.getElementById('songCounter');
        const buttons = document.querySelectorAll('.playlist-btn');

        // 歌曲列表配置
        const playlist = [{
            name: '🎂 生日歌 ①',
            src: 'music1.mp3'
        }, {
            name: '🎈 生日歌 ②',
            src: 'music2.mp3'
        }, {
            name: '🎁 生日歌 ③',
            src: 'music3.mp3'
        }];

        let currentIndex = 0;

        // 切换歌曲函数
        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;

            currentIndex = index;
            const song = playlist[index];

            // 更新 audio 源
            audio.src = song.src;
            audio.load();

            // 更新 UI
            songName.textContent = song.name;
            songCounter.textContent = `${index + 1} / ${playlist.length}`;

            // 更新按钮状态
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            // 自动播放
            audio.play().catch(e => {
                console.log('⏸️ 自动播放被阻止，请手动点击播放');
            });

            console.log(`🎵 切换到: ${song.name}`);
        }

        // 绑定按钮点击事件
        buttons.forEach((btn, index) => {
            btn.addEventListener('click', function () {
                playSong(index);
            });
        });

        // 当一首歌播放结束时，自动切换到下一首
        audio.addEventListener('ended', function () {
            const nextIndex = (currentIndex + 1) % playlist.length;
            playSong(nextIndex);
        });

        // 加载第一首歌
        playSong(0);

        // 错误处理
        audio.addEventListener('error', function (e) {
            console.warn('⚠️ 音乐加载失败，请检查文件是否存在');
            console.warn('💡 提示：将音乐文件放在与HTML相同的目录下');
            console.warn('📁 需要文件：music.mp3, birthday_song_02.mp3, birthday_song_03.mp3');
        });

        audio.addEventListener('loadeddata', function () {
            console.log(`✅ 音乐加载成功: ${playlist[currentIndex].name}`);
        });
    </script>

</body>

</html>
