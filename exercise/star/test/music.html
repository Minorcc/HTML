<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生日快乐 · 逐字弹跳 + 音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 3.5rem;
            padding: 3rem 2rem;
            box-shadow: 0 25px 45px -10px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        .title {
            text-align: center;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 1.1rem;
            color: rgba(255, 215, 150, 0.5);
            text-transform: uppercase;
            border-bottom: 1px dashed rgba(255, 215, 150, 0.15);
            padding-bottom: 0.75rem;
            width: 100%;
        }

        /* ===== 逐字弹跳动画 ===== */
        .bounce-text {
            font-size: clamp(3rem, 12vw, 5.5rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-align: center;
            color: #fae3d9;
            text-shadow: 0 4px 20px rgba(255, 160, 120, 0.15);
            line-height: 1.4;
            padding: 0.5rem 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.05em;
        }

        .bounce-text span {
            display: inline-block;
            animation: bounceLetter 0.9s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite alternate;
            animation-delay: calc(0.08s * var(--i, 0));
            transform-origin: center bottom;
            text-shadow: 0 2px 10px rgba(255, 140, 80, 0.3);
        }

        @keyframes bounceLetter {
            0% {
                transform: translateY(0) scale(0.9);
                color: #ffdcc9;
                text-shadow: 0 0 5px #ffaf8a;
            }

            100% {
                transform: translateY(-0.25em) scale(1.05);
                color: #fff0e5;
                text-shadow: 0 8px 25px #ff8040;
            }
        }

        /* ===== 音乐播放器样式 ===== */
        .music-player {
            width: 100%;
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 150, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .music-player audio {
            width: 280px;
            max-width: 100%;
            height: 40px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
        }

        .music-player audio::-webkit-media-controls-panel {
            background: rgba(255, 215, 150, 0.05);
            border-radius: 30px;
        }

        .music-player audio::-webkit-media-controls-play-button {
            background-color: #ffb08c;
            border-radius: 50%;
        }

        .music-info {
            color: rgba(255, 215, 180, 0.6);
            font-size: 0.85rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .music-info .icon {
            font-size: 1.2rem;
        }

        .music-tip {
            color: rgba(255, 180, 150, 0.25);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1rem;
                border-radius: 2.5rem;
                gap: 2rem;
            }

            .bounce-text {
                font-size: clamp(2.2rem, 14vw, 3.2rem);
            }

            .music-player {
                flex-direction: column;
                padding: 1.2rem;
                border-radius: 30px;
                gap: 0.8rem;
            }

            .music-player audio {
                width: 100%;
            }
        }

        .footer-note {
            text-align: center;
            color: rgba(255, 200, 170, 0.15);
            font-size: 0.7rem;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255, 200, 170, 0.05);
            padding-top: 1.5rem;
            width: 100%;
            font-weight: 300;
        }

        .footer-note span {
            color: rgba(255, 180, 150, 0.2);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="title">✨ 生日快乐 ✨</div>

        <!-- 逐字弹跳效果 -->
        <div class="bounce-text">
            <span style="--i:0;">🎂</span>
            <span style="--i:1;">生</span>
            <span style="--i:2;">日</span>
            <span style="--i:3;">快</span>
            <span style="--i:4;">乐</span>
            <span style="--i:5;">🎈</span>
        </div>

        <!-- 音乐播放器 -->
        <div class="music-player">
            <div class="music-info">
                <span class="icon">🎵</span>
                <span>生日祝福</span>
            </div>
            <audio controls loop>
                <!-- ⚠️ 请将下面的 src 替换为您自己的音乐文件路径 -->
                <source src="music1.mp3" type="audio/mpeg">
                您的浏览器不支持 audio 元素。
            </audio>
            <span class="music-tip">♫ 循环播放</span>
        </div>

        <div class="footer-note">
            <span>💡 将 music.mp3 放在同一目录下</span>
        </div>
    </div>

    <script>
        // 音乐加载提示
        const audio = document.querySelector('audio');
        if (audio) {
            audio.addEventListener('error', function (e) {
                console.warn('⚠️ 音乐文件加载失败，请检查文件路径');
                console.warn('💡 提示：将 music1.mp3 放在与HTML相同的目录下');
            });

            audio.addEventListener('loadeddata', function () {
                console.log('✅ 音乐加载成功！🎶');
            });
        }
    </script>

</body>

</html>
