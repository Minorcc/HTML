<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>生日快乐 · 打字机</title>
    <style>
        /* ===== 全局重置 & 背景 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 20% 30%, rgba(41, 128, 185, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(192, 57, 43, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, #000010, #000030, #000020);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* ===== 星空 ===== */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: transparent;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        .star.large {
            width: 4px;
            height: 4px;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            animation: twinkle-large 5s infinite alternate;
        }

        .star.medium {
            width: 2px;
            height: 2px;
            box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.6);
            animation: twinkle-medium 4s infinite alternate;
        }

        .star.small {
            width: 1px;
            height: 1px;
            box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.4);
            animation: twinkle-small 3s infinite alternate;
        }

        @keyframes twinkle-large {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            20% {
                opacity: 0.7;
                transform: scale(1.2);
            }

            50% {
                opacity: 1;
                transform: scale(1.7);
            }

            75% {
                opacity: 0.8;
                transform: scale(1.3);
            }
        }

        @keyframes twinkle-medium {

            0%,
            100% {
                opacity: 0.1;
                transform: scale(1);
            }

            25% {
                opacity: 0.4;
                transform: scale(1.2);
            }

            50% {
                opacity: 1;
                transform: scale(1.9);
            }

            80% {
                opacity: 0.5;
                transform: scale(1.3);
            }
        }

        @keyframes twinkle-small {

            0%,
            100% {
                opacity: 0.05;
                transform: scale(1);
            }

            30% {
                opacity: 0.5;
                transform: scale(1.4);
            }

            50% {
                opacity: 0.95;
                transform: scale(2.1);
            }

            70% {
                opacity: 0.35;
                transform: scale(1.3);
            }
        }

        /* ===== 主卡片容器 ===== */
        .content {
            position: relative;
            z-index: 10;
            width: 460px;
            max-width: 80vw;
            padding: 2rem 1.8rem 2rem;
            background: rgba(10, 20, 40, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 2rem;
            border: 1px solid rgba(52, 152, 219, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            color: #f0f4ff;
            text-align: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        /* ===== 打字机区域 ===== */
        .typewriter-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        /* 🎂 先出现，无光标 */
        .emoji-first {
            font-size: 3.6rem;
            line-height: 1.2;
            margin-bottom: 0.2rem;
            opacity: 0;
            animation: fadeInEmoji 0.5s ease 0.3s forwards;
            filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.3));
            letter-spacing: 6px;
        }

        @keyframes fadeInEmoji {
            0% {
                opacity: 0;
                transform: scale(0.7) rotate(-8deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        /* 打字机容器 — 使用相对定位，光标使用绝对定位跟随 */
        .typewriter-line {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            font-weight: 700;
            min-height: 5rem;
            color: #f0f4ff;
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.3);
            gap: 2px;
            position: relative;
            padding: 0 0.2rem;
            flex-wrap: wrap;
        }

        /* 每个字符的容器 */
        .char-unit {
            display: inline-block;
            position: relative;
            white-space: pre;
        }

        /* 字符本身 — 渐变文字 */
        .char-unit span {
            display: inline-block;
            background: linear-gradient(135deg, #8ecae6, #bdb2ff, #ff9ff3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0;
            /* 初始隐藏，由动画显现 */
        }

        /* ===== 光标 — 使用绝对定位，通过JS动态设置位置 ===== */
        .cursor-blink {
            position: absolute;
            display: block;
            width: 4px;
            height: 3.2rem;
            background: #bdb2ff;
            border-radius: 2px;
            box-shadow: 0 0 16px 4px rgba(189, 178, 255, 0.6);
            animation: blinkCursor 0.9s step-end infinite;
            transition: left 0.15s ease;
            /* 平滑移动 */
            pointer-events: none;
            /* 初始位置在第一个字符前（left:0） */
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        /* 光标隐藏状态 */
        .cursor-blink.hidden {
            opacity: 0;
            animation: none;
            box-shadow: none;
            width: 0;
        }

        @keyframes blinkCursor {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.1;
            }
        }

        /* 字符显现动画 — 带弹性效果 */
        @keyframes typeInChar {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.85);
            }

            40% {
                opacity: 0.7;
                transform: translateY(-2px) scale(1.05);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 底部小字 */
        .lunar-date {
            margin-top: 0.8rem;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: #dfeaff;
            font-weight: 500;
            opacity: 0.9;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .content {
                width: min(86vw, 360px);
                padding: 1.6rem 1rem;
            }

            .emoji-first {
                font-size: 2.8rem;
            }

            .typewriter-line {
                font-size: 2.4rem;
                min-height: 4rem;
            }

            .cursor-blink {
                height: 2.4rem;
                width: 3px;
            }
        }

        @media (max-width: 400px) {
            .typewriter-line {
                font-size: 1.8rem;
                min-height: 3.2rem;
            }

            .cursor-blink {
                height: 2rem;
            }
        }
    </style>
</head>

<body>

    <!-- 星空背景 -->
    <div id="starfield"></div>

    <!-- 主卡片 -->
    <div class="content">
        <div class="typewriter-wrapper">
            <!-- 🎂 先出现（独立，无光标） -->
            <div class="emoji-first">🎂</div>

            <!-- 打字机行：包含“生日快乐”四个字 + 光标（使用绝对定位） -->
            <div class="typewriter-line" id="typewriterLine">
                <!-- 四个字符单元 -->
                <div class="char-unit" data-index="0"><span>生</span></div>
                <div class="char-unit" data-index="1"><span>日</span></div>
                <div class="char-unit" data-index="2"><span>快</span></div>
                <div class="char-unit" data-index="3"><span>乐</span></div>
                <!-- 光标使用绝对定位，通过JS控制 left 值 -->
                <span class="cursor-blink" id="cursorBlink"></span>
            </div>

            <!-- 底部小字 -->
            <div class="lunar-date">✦ 七月初六 · 星河共庆 ✦</div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const charUnits = document.querySelectorAll('.char-unit');
            const cursor = document.getElementById('cursorBlink');
            const typewriterLine = document.getElementById('typewriterLine');
            const totalChars = charUnits.length;

            // 每个字符打字时长 (1.5秒)
            const CHAR_INTERVAL = 1500;

            // 🎂 出现后延迟启动
            const START_DELAY = 800;

            // 存储每个字符的宽度和累积偏移
            let charOffsets = [];

            // 计算每个字符的累积偏移量（相对于 typewriter-line 的左边缘）
            function calculateCharOffsets() {
                charOffsets = [];
                let accumulated = 0;
                charUnits.forEach((unit, index) => {
                    const span = unit.querySelector('span');
                    // 先临时显示以获取宽度
                    const originalDisplay = span.style.display;
                    const originalOpacity = span.style.opacity;
                    span.style.display = 'inline-block';
                    span.style.opacity = '1';
                    span.style.animation = 'none';

                    const width = span.offsetWidth;
                    // 加上 gap (2px) 和字符自身的 margin
                    // 实际每个字符占用的宽度 = 字符宽度 + 右侧间距 (gap 是 2px)
                    // 但这里我们用 offsetLeft 更准确
                    const offsetLeft = unit.offsetLeft;

                    charOffsets.push({
                        left: offsetLeft,
                        width: width,
                        // 光标应该放在字符右侧，所以位置 = offsetLeft + width
                        cursorPosition: offsetLeft + width
                    });

                    // 恢复隐藏
                    span.style.display = originalDisplay || 'inline-block';
                    span.style.opacity = originalOpacity || '0';
                });
            }

            // 重置所有字符为隐藏
            function resetAllChars() {
                charUnits.forEach((unit) => {
                    const span = unit.querySelector('span');
                    if (span) {
                        span.style.animation = 'none';
                        span.style.opacity = '0';
                        span.style.animationDelay = '0ms';
                    }
                });
            }

            // 显示第 n 个字符
            function revealChar(index) {
                if (index >= totalChars) return;
                const unit = charUnits[index];
                const span = unit?.querySelector('span');
                if (span) {
                    span.style.animation = 'none';
                    void span.offsetWidth;
                    span.style.animation = 'typeInChar 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                    span.style.opacity = '1';
                }
            }

            // 移动光标到指定字符后面
            function moveCursorTo(index) {
                if (index < 0 || index >= totalChars) return;
                // 使用计算好的位置
                const pos = charOffsets[index]?.cursorPosition;
                if (pos !== undefined) {
                    cursor.style.left = pos + 'px';
                }
            }

            // 开始打字机流程
            function startTypewriter() {
                resetAllChars();

                // 先计算所有字符的位置（必须在显示之前计算，确保布局稳定）
                // 但字符隐藏时 offsetLeft 可能不准确，所以先临时显示所有字符进行计算
                // 更好的方式：让字符可见但透明，或者直接计算
                // 这里我们采用：先临时显示所有字符（不带动画），计算位置，再重置隐藏
                charUnits.forEach((unit) => {
                    const span = unit.querySelector('span');
                    if (span) {
                        span.style.opacity = '0';
                        span.style.animation = 'none';
                        span.style.display = 'inline-block';
                    }
                });
                // 强制重绘
                void typewriterLine.offsetHeight;
                // 计算位置
                calculateCharOffsets();
                // 重置为隐藏
                resetAllChars();

                // 确保光标可见，初始位置在第一个字符前 (left: 0)
                cursor.classList.remove('hidden');
                cursor.style.left = '0px';

                let currentIndex = 0;

                function typeNext() {
                    if (currentIndex < totalChars) {
                        // 显示当前字符
                        revealChar(currentIndex);

                        // 光标移动到当前字符后面（跟随）
                        // 注意：因为字符显示有动画，但光标位置立即移动，模拟跟随
                        moveCursorTo(currentIndex);

                        currentIndex++;

                        setTimeout(typeNext, CHAR_INTERVAL);
                    } else {
                        // 全部显示完毕，延迟后隐藏光标
                        setTimeout(() => {
                            cursor.classList.add('hidden');
                        }, 600);
                    }
                }

                setTimeout(typeNext, START_DELAY);
            }

            // 启动
            startTypewriter();

            // 窗口尺寸变化时重新计算位置（防抖）
            let resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // 如果打字还未完成，重新计算位置
                    // 简单处理：重新计算并更新当前光标位置
                    charUnits.forEach((unit) => {
                        const span = unit.querySelector('span');
                        if (span) {
                            span.style.opacity = '0';
                            span.style.animation = 'none';
                            span.style.display = 'inline-block';
                        }
                    });
                    void typewriterLine.offsetHeight;
                    calculateCharOffsets();
                    resetAllChars();
                    // 重新显示已经打出的字符
                    // 这里简单处理：重新启动（因为重新计算复杂，且用户很少在打字时调整窗口）
                    // 更稳妥：保存状态，但为了演示，建议用户不要中途调整
                }, 300);
            });

            // 生成星星装饰
            function createStars() {
                const starfield = document.getElementById('starfield');
                const count = 120;
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    const sizeClass = Math.random() > 0.7 ? 'large' : (Math.random() > 0.4 ? 'medium' : 'small');
                    star.className = `star ${sizeClass}`;
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = (Math.random() * 8) + 's';
                    star.style.animationDuration = (3 + Math.random() * 6) + 's';
                    starfield.appendChild(star);
                }
            }
            createStars();

        })();
    </script>
</body>

</html>
