<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>自然星空 · 动态背景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow: hidden;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #0b0f1f;
            overflow: hidden;
        }

        #starfield canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0b0f1f;
        }

        .content {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 2rem;
            padding: 3rem 2.5rem;
            background: rgba(10, 14, 30, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            color: #f0f4ff;
            text-align: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        .content h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #d6e2ff, #b0c6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(90, 140, 255, 0.3);
        }

        .content p {
            font-size: 1.2rem;
            line-height: 1.7;
            opacity: 0.8;
            margin: 1.2rem 0 0.8rem;
            font-weight: 300;
            color: #d3dfff;
        }

        .content small {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.5;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.2rem;
            width: 80%;
            color: #b6c8ff;
        }

        @media (max-width: 600px) {
            .content {
                padding: 2rem 1.5rem;
                margin: 1.2rem;
                border-radius: 2rem;
            }

            .content h1 {
                font-size: 2.2rem;
            }

            .content p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div id="starfield"></div>

    <div class="content">
        <h1>✨2026-08-17</h1>
        <p>世界因你<br>值得期待</p>
        <small>✦ 自然星空 ✦</small>
    </div>

    <script>
        (function () {
            const starfield = document.getElementById('starfield');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const stars = [];
            let width = 0;
            let height = 0;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function createStar() {
                const size = Math.random();
                const radius = 0.8 + size * 2.5;
                const speed = 0.02 + Math.random() * 0.08;

                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * speed,
                    vy: (Math.random() - 0.5) * speed,
                    r: radius,
                    alpha: 0.25 + Math.random() * 0.75,
                    phase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 0.002 + Math.random() * 0.005,
                    glow: 6 + Math.random() * 12
                };
            }

            function initStars() {
                stars.length = 0;
                const count = 180;
                for (let i = 0; i < count; i++) {
                    stars.push(createStar());
                }
            }

            function updateStars(time) {
                for (const star of stars) {
                    star.vx += (Math.random() - 0.5) * 0.01;
                    star.vy += (Math.random() - 0.5) * 0.01;

                    const maxSpeed = 0.14;
                    const speed = Math.hypot(star.vx, star.vy);
                    if (speed > maxSpeed) {
                        star.vx = (star.vx / speed) * maxSpeed;
                        star.vy = (star.vy / speed) * maxSpeed;
                    }

                    star.x += star.vx;
                    star.y += star.vy;

                    if (star.x < -10) star.x = width + 10;
                    if (star.x > width + 10) star.x = -10;
                    if (star.y < -10) star.y = height + 10;
                    if (star.y > height + 10) star.y = -10;
                }
            }

            function drawStars(time) {
                ctx.fillStyle = 'rgba(11, 15, 31, 0.95)';
                ctx.fillRect(0, 0, width, height);

                for (const star of stars) {
                    const pulse = (Math.sin(time * star.twinkleSpeed + star.phase) + 1) * 0.5;
                    const alpha = star.alpha * (0.25 + pulse * 0.8);
                    const radius = star.r * (0.8 + pulse * 0.7);

                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.shadowBlur = star.glow;
                    ctx.shadowColor = `rgba(255,255,255,${alpha})`;
                    ctx.arc(star.x, star.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.shadowBlur = 0;
            }

            let last = 0;
            function animate(ts) {
                const time = ts * 0.001;
                if (ts - last > 16) {
                    updateStars(time);
                    drawStars(time);
                    last = ts;
                }
                requestAnimationFrame(animate);
            }

            starfield.appendChild(canvas);
            resizeCanvas();
            initStars();
            requestAnimationFrame(animate);

            window.addEventListener('resize', function () {
                resizeCanvas();
                initStars();
            });
        })();
    </script>

</body>

</html>
